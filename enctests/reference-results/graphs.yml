# Where each graph in the documentation comes from.
#
# Each entry is the prefix of the published images (<prefix>-<graph name>.png in this folder).
#   config:  the test config that made them (relative to enctests/).
#   otio:    the results of that run, in this folder. The FFmpeg version and run date are read from it.
#   report:  the config's report name, only when it differs from the prefix (the graphs were renamed when copied).
#   note:    anything else needed to reproduce the graphs.
#
# update_doc_graphs.py --check checks this file against the pages, the configs and the OTIO files;
# update_doc_graphs.py --update copies a new run in. See README.md.

graphs:
  aomav1-crf-test:
    config: test_wedge_configs/aomav1_crf_tests.yml
    otio: aomav1_crf_tests.otio
