test_mjpeg:
    name: test_mjpeg_quality
    description: variations of mjpeg_quality
    app: ffmpeg
    suffix: .mov
    encoding_template: '{ffmpeg_bin} -f image2 {input_args} -i "{source}" -frames:v {duration} -xerror {encoding_args} -y "{outfile}"'
    sources:
    - sources/enc_sources/chimera_fountains_srgb_jpg_100/chimera_fountains_srgb.%05d.jpg.yml
    wedges:
        compression_100:
            -vcodec: copy
            -compression: 100
            -colorspace: bt709
            -color_primaries: bt709
            -color_trc: iec61966-2-1 


