---

reports:
    graphs:
    - args:
        color: media
        height: 400
        x: -compression
        y: psnr_y_harmonic_mean
        markers: True
      name: psnr_y_harmonic_mean.png
      sortby: wedge
    - args:
        color: media
        height: 400
        x: -compression
        y: vmaf_harmonic_mean
        markers: True
      name: vmaf_harmonic_mean.png
      sortby: wedge
    - args:
        color: media
        height: 400
        x: -compression
        y: encode_time
        markers: True
      name: encode_time.png
      sortby: wedge
    - args:
        color: media
        height: 400
        x: -compression
        y: filesize
        markers: True
      name: filesize.png
      sortby: wedge
    name: mjpeg-qscale-tests
    title: mjpeg quality comparison.
    description: This is a comparison of different quality settings for the mjpeg encoder.
    directory: mjpeg-qscale-encode
    templatefile: basicmovie.html.jinja
