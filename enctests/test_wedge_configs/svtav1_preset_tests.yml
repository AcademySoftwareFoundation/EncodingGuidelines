test_libsvtav1_preset:
    name: test_libsvtav1_preset
    description: variations of preset yuv420pp10le
    app: ffmpeg
    suffix: .mp4
    encoding_template: 'ffmpeg {input_args} -i "{source}" -frames:v {duration} {encoding_args} -y "{outfile}"'
    sources:
    - sources/enc_sources/chimera_cars_srgb/chimera_cars_srgb.%05d.png.yml
    - sources/enc_sources/chimera_coaster_srgb/chimera_coaster_srgb.%06d.png.yml
    - sources/enc_sources/chimera_fountains_srgb/chimera_fountains_srgb.%05d.png.yml
    - sources/hdr_sources/sparks_srgb/sparks_srgb.%05d.png.yml
    wedges:
        preset_01: &base_args
            -c:v: libsvtav1
            -crf: 15
            -svtav1-params: tune=0
            -preset: 1
            -pix_fmt: yuv420p10le
            -sws_flags: spline+accurate_rnd+full_chroma_int
            -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=tv:out_color_matrix=bt709"'
            -color_range: 1
            -colorspace: 1
            -color_primaries: 1
            -color_trc: 2

        preset_02:
            << : *base_args
            -preset: 2

        preset_03:
            << : *base_args
            -preset: 3
        preset_04:
            << : *base_args
            -preset: 4
        preset_05:
            << : *base_args
            -preset: 5
        preset_06:
            << : *base_args
            -preset: 6
        preset_07:
            << : *base_args
            -preset: 7
        preset_08:
            << : *base_args
            -preset: 8
        preset_09:
            << : *base_args
            -preset: 9
        preset_10:
            << : *base_args
            -preset: 10
---

reports:
    graphs:
    - args:
        color: media
        height: 400
        x: -preset
        y: psnr_y_harmonic_mean
        markers: True
      name: psnr_y_harmonic_mean.png
      sortby: name
    - args:
        color: media
        height: 400
        x: -preset
        y: vmaf_harmonic_mean
        markers: True
      name: vmaf_harmonic_mean.png
      sortby: name
    - args:
        color: media
        height: 400
        x: -preset
        y: encode_time
        markers: True
      name: encode_time.png
      sortby: name
    - args:
        color: media
        height: 400
        x: -preset
        y: filesize
        markers: True
      name: filesize.png
      sortby: name
    name: av1-preset-test
    title: SVT-AV1 Preset Comparison
    description: This is a comparison of different Preset values for libsvtav1 (av1) encoding.
    directory: av1-preset-encode
    templatefile: basicmovie.html.jinja

