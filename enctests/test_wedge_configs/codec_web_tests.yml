test_8_420:
    name: test_8_420
    description: A comparison of different codecs, with VMAF > 98.
    app: ffmpeg
    suffix: .mp4
    encoding_template: 'ffmpeg {input_args} -i "{source}" -frames:v {duration} {encoding_args} -y "{outfile}"'
    sources:
    - ../sourceimages/test420.png
    wedges:
        libx264: &base_args
            -c:v: libx264
            -pix_fmt: yuv420p
            -crf: 18
            -preset: slow
            -vf: '"zscale=matrix=709:range=limited:filter=lanczos,setparams=color_primaries=bt709:color_trc=iec61966-2-1"'
            -color_range: 1
            -colorspace: 1
            -color_primaries: 1
            -color_trc: 13

        vp9:
            << : *base_args
            -c:v: libvpx-vp9
            -quality: good
            -b:v: 0
            -crf: 22
            -row-mt: 1
            -speed: 2

        libx265:
            << : *base_args
            -c:v: libx265
            -tag:v: hvc1
            -preset: medium
            -crf: 20

        libsvtav1:
            << : *base_args
            -crf: 18
            -c:v: libsvtav1
            -preset: slow
            -svtav1-params: tune=0
            -preset: 5

