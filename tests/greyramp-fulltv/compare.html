<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encoding Compare</title>
<style>
:root {
  --bg: #27262b;
  --surface: #302d36;
  --surface-2: #3a3741;
  --border: #44434d;
  --text: #e6e1e8;
  --muted: #a9a3b0;
  --accent: #2c84fa;
  --a: #f2a33a;
  --b: #4ea1ff;
  --good: #5fd08a;
  --bad: #ff6b6b;
  --stage: #141317;
  --radius: 6px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 1600px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.35rem; margin: 0 0 4px; font-weight: 650; }
.lede { margin: 0 0 12px; color: var(--muted); max-width: 72ch; }
.lede b { color: var(--text); font-weight: 600; }

/* Toolbar */
.toolbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  padding: 10px 12px; margin: 0 -4px 10px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border: 1px solid var(--border); border-radius: var(--radius);
}
.group { display: flex; align-items: center; gap: 6px; }
.group > .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button {
  background: var(--surface); color: var(--text); border: 0; padding: 5px 10px; font: inherit; cursor: pointer;
  border-left: 1px solid var(--border);
}
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:focus-visible, select:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select {
  background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 5px 8px; font: inherit; max-width: 260px;
}
.side { font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center;
  font-size: 12px; color: #111; }
.side.a { background: var(--a); }
.side.b { background: var(--b); }
.btn {
  background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 5px 9px; font: inherit; cursor: pointer;
}
.btn:hover, .seg button:hover:not([aria-pressed="true"]) { background: var(--surface-2); }
.presets { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin: 0 0 10px; color: var(--muted); }
.presets .btn { font-size: 13px; padding: 3px 9px; }
.hidden { display: none !important; }

/* Viewer */
.viewer { position: relative; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  background: var(--stage); }
.stage { overflow: auto; position: relative; }
.stage.zoomed { max-height: 72vh; }
.canvas { position: relative; margin: 0 auto; touch-action: none; user-select: none; }
.canvas img, .canvas canvas, .canvas video { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  pointer-events: none; -webkit-user-drag: none; user-select: none; }
.canvas.px img, .canvas.px canvas, .canvas.px video { image-rendering: pixelated; }
.inactive { display: none !important; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.canvas.wipe { cursor: ew-resize; }
.canvas.toggle { cursor: pointer; }
.divider { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.5); pointer-events: none; }
.divider::after { content: "◀ ▶"; position: absolute; top: 50%; left: -22px; width: 44px; transform: translateY(-50%);
  background: #fff; color: #111; border-radius: 12px; font-size: 11px; text-align: center; padding: 2px 0;
  box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.badge { position: absolute; top: 8px; z-index: 2; padding: 3px 9px 3px 4px; border-radius: 14px; font-size: 13px;
  background: rgba(20,19,23,.82); border: 1px solid var(--border); display: flex; gap: 6px; align-items: center;
  max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.badge.a { left: 8px; } .badge.b { right: 8px; }
.badge.dim { opacity: .35; }
.badge.center { left: 50%; right: auto; transform: translateX(-50%); max-width: 80%; }
.statusbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding: 6px 10px;
  font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--surface); }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 4px; background: var(--bg); color: var(--text); }
.note { color: var(--muted); font-size: 12px; }

/* Cards */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
  min-width: 0; }
.card h2 { font-size: 1rem; margin: 0 0 2px; display: flex; gap: 8px; align-items: center; }
.card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.stat { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 9px;
  min-width: 78px; }
.stat .k { display: block; font-size: 11px; color: var(--muted); }
.stat .v { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.card p { margin: 6px 0; }
code, pre { font-family: var(--mono); font-size: 12px; }
.flags { display: block; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 6px 8px; white-space: pre-wrap; word-break: break-all; }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details pre { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
  white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; }

/* Results table */
h2.section { font-size: 1.1rem; margin: 8px 0 4px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th { background: var(--surface); font-weight: 600; font-size: 12px; color: var(--muted); }
th.l, td.l { text-align: left; }
tr.grp td { background: var(--surface-2); font-weight: 600; text-align: left; color: var(--text); }
tbody tr.row:hover { background: var(--surface); }
tr.isA td:first-child { box-shadow: inset 3px 0 0 var(--a); }
tr.isB td:first-child { box-shadow: inset 3px 0 0 var(--b); }
tr.isA.isB td:first-child { box-shadow: inset 3px 0 0 var(--a), inset 6px 0 0 var(--b); }
td.pick { white-space: nowrap; text-align: left; }
td.pick button { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 50%;
  width: 22px; height: 22px; font-size: 11px; font-weight: 700; cursor: pointer; padding: 0; margin-right: 3px; }
tr.isA td.pick button.pa { background: var(--a); color: #111; border-color: var(--a); }
tr.isB td.pick button.pb { background: var(--b); color: #111; border-color: var(--b); }
td.best { color: var(--good); }
td.worst { color: var(--bad); }
td.warn { color: var(--a); }
.colgrp { border-left: 1px solid var(--border); }
.probe { position: fixed; z-index: 20; pointer-events: none; background: rgba(20,19,23,.94); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.5); min-width: 250px; }
.probe table { width: auto; font-family: var(--mono); font-size: 12px; }
.probe th, .probe td { padding: 2px 6px; border: 0; background: none; }
.probe th { color: var(--muted); font-weight: 500; }
.probe .t { color: var(--muted); margin-bottom: 4px; font-family: var(--mono); }
.probe .n { color: var(--muted); margin-top: 4px; max-width: 300px; white-space: normal; }
.probe td.l { text-align: left; font-family: system-ui, sans-serif; }
.probe .pin { color: var(--a); }
.marker { position: absolute; pointer-events: none; border: 1px solid #fff; outline: 1px solid #000; z-index: 3; }
.canvas.probing { cursor: crosshair; }
footer { margin: 18px 0 8px; color: var(--muted); font-size: 12px; max-width: 90ch; }
footer p { margin: 4px 0; }
a { color: var(--accent); }

@media (max-width: 760px) {
  main { padding: 10px; }
  .cards { grid-template-columns: 1fr; }
  .toolbar { position: static; }
  select { max-width: 100%; }
  .group.ab { flex-wrap: wrap; }
}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>

  <div class="toolbar" role="toolbar" aria-label="Comparison controls">
    <div class="group"><span class="lbl">Image</span><div class="seg" id="srcSeg"></div></div>
    <div class="group ab">
      <span class="side a">A</span><select id="selA" aria-label="Result A"></select>
      <button class="btn" id="swap" title="Swap A and B (X)" aria-label="Swap A and B">⇄</button>
      <span class="side b">B</span><select id="selB" aria-label="Result B"></select>
    </div>
    <div class="group hidden" id="showGrp"><span class="lbl">Show</span><div class="seg" id="showSeg">
      <button data-show="measured" title="The files decoded by zscale, as measured">Measured</button>
      <button data-show="browser" title="The video files, played by this browser">Your browser</button>
    </div></div>
    <div class="group"><span class="lbl">View</span><div class="seg" id="modeSeg">
      <button data-mode="wipe" title="Wipe (W)">Wipe</button>
      <button data-mode="toggle" title="Toggle (Space)">Toggle</button>
      <button data-mode="diff" title="Difference (D)">Difference</button>
    </div></div>
    <div class="group" id="flickerGrp"><label class="note"><input type="checkbox" id="flicker"> Flicker</label></div>
    <div class="group hidden" id="gainGrp"><span class="lbl" title="|A − B| is multiplied by this before it is shown">Gain</span><div class="seg" id="gainSeg">
      <button data-gain="1">×1</button><button data-gain="4">×4</button><button data-gain="16">×16</button><button data-gain="64">×64</button><button data-gain="256">×256</button>
    </div></div>
    <div class="group"><span class="lbl">Zoom</span><div class="seg" id="zoomSeg">
      <button data-zoom="0" title="Fit (0)">Fit</button>
      <button data-zoom="1" title="One image pixel per screen pixel (1)">1:1</button>
      <button data-zoom="2" title="(2)">2×</button>
      <button data-zoom="4" title="(4)">4×</button>
      <button data-zoom="8" title="(8)">8×</button>
    </div></div>
    <div class="group"><div class="seg"><button id="probeBtn" title="Show the stored Y′CbCr values under the cursor; click to pin (P)">Probe</button></div></div>
  </div>

  <div class="presets" id="presets"><span>Try:</span></div>

  <div class="viewer" id="viewer">
    <div class="badge a" id="badgeA"><span class="side a">A</span><span></span></div>
    <div class="badge b" id="badgeB"><span class="side b">B</span><span></span></div>
    <div class="stage" id="stage">
      <div class="canvas" id="canvas">
        <img id="imgA" alt="" draggable="false">
        <video id="vidA" class="inactive" muted loop playsinline preload="auto"></video>
        <img id="imgB" alt="" draggable="false">
        <video id="vidB" class="inactive" muted loop playsinline preload="auto"></video>
        <canvas id="diff" class="hidden"></canvas>
        <div class="divider" id="divider"></div>
        <div class="marker hidden" id="marker"></div>
      </div>
    </div>
    <div class="statusbar">
      <span id="hint"></span>
      <span><kbd>Space</kbd> flip · <kbd>W</kbd> wipe · <kbd>D</kbd> difference · <kbd>X</kbd> swap ·
        <kbd>←</kbd><kbd>→</kbd> move wipe · <kbd>0</kbd><kbd>1</kbd><kbd>2</kbd><kbd>4</kbd><kbd>8</kbd> zoom · <kbd>P</kbd> probe</span>
    </div>
  </div>

  <div class="cards">
    <section class="card" id="cardA" aria-label="Result A"></section>
    <section class="card" id="cardB" aria-label="Result B"></section>
  </div>

  <h2 class="section">All results</h2>
  <p class="note" style="margin:0 0 6px"><span id="tableNote"></span>
    Pick a row as <span class="side a">A</span> or <span class="side b">B</span>.</p>
  <div class="tablewrap"><table id="results"></table></div>

  <div class="probe hidden" id="probe" role="status" aria-live="polite"></div>
  <footer id="footer"></footer>
</main>

 "footer": "<p>Made with FFmpeg 9.0.2. Every file is encoded with <code>libx264 -preset slow -crf 18</code>, 24 frames of the still image, so the measured errors include some compression. <i>Measured</i> decodes the first frame with <code>zscale</code> as BT.709, at the range the file is tagged with (limited if it is not tagged, as players assume). <i>Your browser</i> plays the .mp4 files themselves; the source is the PNG. We have seen full range work in Chrome, Safari and Firefox, and in RV.</p><p>zscale's dither (none by default) matters at 8-bit. By CAMBI, ordered and random cut the banding on every gradient by half or more; random did best on the radial gradients, ordered on the plain ramps, and error diffusion helped least. Dither slightly raises the per-pixel error, and it survives -crf 18. From a 16-bit source, 10-bit needs no dither. CAMBI reads the stored values, so it does not see a range mislabel. All results were the same on FFmpeg 6.1.6 and 9.0.2.</p><p>See <a href='../../Quickstart.html#tv-vs-full-range-' target='_top'>TV vs. Full range</a> and <a href='../../ColorPreservation.html' target='_top'>RGB to YCbCr Conversion</a>. Generated by <a href='../icctest-fulltv.py' target='_top'>tests/icctest-fulltv.py</a>.</p>",

function renderCard(el, side, id) {
  const s = srcInfo();
  if (id === "source") {
    el.innerHTML = `<h2><span class="side ${side}">${side.toUpperCase()}</span>${esc(DATA.sourceLabel || "Source")}</h2>
      <div class="sub">${esc(s.label)} · ${esc(s.description)}</div>${statBlock(null)}
      ${s.cambi !== undefined && s.cambi !== null ? `<p class="note">Banding (CAMBI) of the source itself: <b>${s.cambi.toFixed(1)}</b>. An 8-bit source can already band before it is encoded.</p>` : ""}`;
    return;
  }
  const it = item(id), r = it.results[state.src];
  el.innerHTML = `<h2><span class="side ${side}">${side.toUpperCase()}</span>${esc(it.label)}</h2>
    <div class="sub">${esc(it.group)} · ${esc(s.label)} · error in ${esc(DATA.unit)}</div>
    ${statBlock(r)}
    <p>${esc(it.description)}</p>
    <code class="flags">${esc(it.flags || "(no colour options)")}</code>
    ${browserView() ? `<p class="note">Shown: <code>${esc(r.video)}</code>, played by this browser${videoNote(side)}.</p>` : ""}
    <details><summary>Full commands</summary><pre>${esc(r.encode)}</pre><pre>${esc(r.decode)}</pre></details>`;
}

function buildTable() {
  const t = $("results");
  const srcs = DATA.sources;
  const stats = DATA.stats, rank = DATA.rankKey || "mean";
  let h = `<thead><tr><th class="l" rowspan="2"></th><th class="l" rowspan="2">${esc(DATA.rowLabel || "Conversion")}</th>`;
  for (const s of srcs) h += `<th colspan="${stats.length}" class="colgrp" style="text-align:center">${esc(s.label)}</th>`;
  h += `</tr><tr>`;
  for (const s of srcs) h += stats.map((st, k) => `<th class="${k ? "" : "colgrp"}" title="${esc(st.title || "")}">${esc(st.short || st.label)}</th>`).join("");
  h += `</tr></thead><tbody>`;
  for (const g of DATA.groups) {
    h += `<tr class="grp"><td colspan="${2 + stats.length * srcs.length}">${esc(g.label)}</td></tr>`;
    const best = {};
    for (const s of srcs) {
      const vals = g.items.map((id) => item(id).results[s.id]).filter(Boolean).map((r) => r[rank]);
      best[s.id] = { min: Math.min(...vals), max: Math.max(...vals), n: vals.length };
    }
    for (const id of g.items) {
      const it = item(id);
      h += `<tr class="row" data-id="${id}"><td class="pick"><button class="pa" data-side="a" aria-label="Set A to ${esc(it.label)}">A</button><button class="pb" data-side="b" aria-label="Set B to ${esc(it.label)}">B</button></td><td class="l">${esc(it.label)}</td>`;
      for (const s of srcs) {
        const r = it.results[s.id];
        if (!r) { h += stats.map((st, k) => `<td class="${k ? "" : "colgrp"} note">${k ? "" : "n/a"}</td>`).join(""); continue; }
        h += stats.map((st, k) => {
          let cls = k ? "" : "colgrp";
          if (st.key === rank && best[s.id].n > 1) cls += r[rank] === best[s.id].min ? " best" : (r[rank] === best[s.id].max ? " worst" : "");
          if (warnStat(r[st.key], st)) cls += " warn";
          return `<td class="${cls}">${fmtStat(r[st.key], st)}</td>`;
        }).join("");
      }
      h += `</tr>`;
    }
  }
  t.innerHTML = h + "</tbody>";
  t.onclick = (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    const id = btn.closest("tr").dataset.id;
    if (!available(id)) {      // only exists for another image: switch to the first one that has it
      const s = DATA.sources.find((x) => item(id).results[x.id]); if (s) state.src = s.id;
    }
    state[btn.dataset.side] = wanted[btn.dataset.side] = id; render();
    $("viewer").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
}
function markTable() {
  for (const tr of $("results").querySelectorAll("tr.row")) {
    tr.classList.toggle("isA", tr.dataset.id === state.a);
    tr.classList.toggle("isB", tr.dataset.id === state.b);
  }
}

function render() {
  fixAvailability();
  const s = srcInfo();
  $("imgA").src = imageFor(state.a); $("imgA").alt = `A: ${labelOf(state.a)}, ${s.label}`;
  $("imgB").src = imageFor(state.b); $("imgB").alt = `B: ${labelOf(state.b)}, ${s.label}`;
  if (browserView()) for (const side of ["a", "b"]) loadVideo(side);
  layout(); renderControls(); renderView();
  renderCard($("cardA"), "a", state.a); renderCard($("cardB"), "b", state.b);
  markTable(); writeHash();
  if (state.probe && lastProbeEvent) probeAt();
}

/* ---------- Keyboard ---------- */
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); if (state.mode !== "toggle") { state.mode = "toggle"; render(); } flip(); }
  else if (k === "w" || k === "W") setMode("wipe");
  else if (k === "d" || k === "D") setMode("diff");
  else if (k === "t" || k === "T") setMode("toggle");
  else if (k === "x" || k === "X") swap();
  else if (k === "p" || k === "P") setProbe(!state.probe);
  else if (k === "Escape" && state.probe) setProbe(false);
  else if (["0", "1", "2", "4", "8"].includes(k)) setZoom(+k);
  else if ((k === "ArrowLeft" || k === "ArrowRight") && state.mode === "wipe") {
    e.preventDefault();
    state.pos = Math.min(1, Math.max(0, state.pos + (k === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 0.1 : 0.01)));
    renderView();
  }
});
window.addEventListener("resize", () => { if (state.zoom === 0) layout(); });

/* ---------- Videos (Your browser) ---------- */
const videoState = { a: "", b: "" };
function videoNote(side) {
  if (!browserView() || state[side] === "source") return "";
  return videoState[side] === "fail" ? " · this browser cannot play it" : "";
}
function loadVideo(side) {
  const S = side.toUpperCase(), v = $("vid" + S), id = state[side];
  if (id === "source") return;
  const src = item(id).results[state.src].video;
  if (v.dataset.src === src) return;
  v.dataset.src = src; videoState[side] = "loading";
  v.onloadeddata = () => { videoState[side] = "ok"; v.play().catch(() => {}); };
  v.onerror = () => { videoState[side] = "fail"; renderView(); renderCard($("card" + S), side, state[side]); };
  v.src = src; v.load();
  setTimeout(() => {
    if (v.dataset.src === src && videoState[side] === "loading" && v.readyState < 2) {
      videoState[side] = "fail"; renderView(); renderCard($("card" + S), side, state[side]);
    }
  }, 4000);
}

/* ---------- Start ---------- */
document.title = DATA.pageTitle || document.title;
$("title").textContent = DATA.title;
$("lede").innerHTML = DATA.lede;
$("tableNote").innerHTML = DATA.tableNote || "";
$("footer").innerHTML = DATA.footer;
readHash();
buildControls(); buildTable(); bindCanvas();
render();
if (state.zoom) setZoom(state.zoom);
</script>
</body>
</html>
